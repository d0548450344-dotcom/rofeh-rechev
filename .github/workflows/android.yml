name: Android

on:
  push:
    branches: ["**"]
    paths: ["android/**", "shared/**", "scripts/gen-dtc.mjs", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", "scripts/gen-dtc.mjs", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # publish the latest APK as a release on main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image ships the Android SDK; ANDROID_HOME is preset.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fault-code tables match shared/dtc
        working-directory: .
        run: node scripts/gen-dtc.mjs --check

      - name: Unit and architecture tests
        run: ./gradlew --no-daemon test

      # The signing key comes from repository secrets and is written only to the
      # runner's temp folder. Same key every build = updates install over the old app.
      - name: Build release APK (signed with the permanent key)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            echo "Signing with the permanent release key."
          else
            echo "::warning::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD secrets are missing. This APK uses a temporary key and will not install over other builds."
          fi
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/rofeh-rechev-${VERSION_CODE}.apk"
          rm -f "$RUNNER_TEMP/release.p12"
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then echo "SIGNED=1" >> "$GITHUB_ENV"; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rofeh-rechev-apk
          path: ${{ runner.temp }}/rofeh-rechev-*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/

      # One permanent link that always serves only the newest signed APK:
      # https://github.com/<owner>/<repo>/releases/latest/download/rofeh-rechev.apk
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP"/rofeh-rechev-*.apk "$RUNNER_TEMP/rofeh-rechev.apk"
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk "$RUNNER_TEMP/rofeh-rechev.apk" \
            --title "רופא רכב · build ${{ github.run_number }}" \
            --notes "הגרסה העדכנית של האפליקציה, חתומה במפתח הקבוע. מותקנת מעל הגרסה הקודמת." \
            --target "${{ github.sha }}" --latest
