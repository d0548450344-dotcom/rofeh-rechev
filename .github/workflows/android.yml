name: Android

on:
  push:
    branches: ["**"]
    paths: ["android/**", "shared/**", "scripts/gen-dtc.mjs", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", "scripts/gen-dtc.mjs", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image ships the Android SDK; ANDROID_HOME is preset.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fault-code tables match shared/dtc
        working-directory: .
        run: node scripts/gen-dtc.mjs --check

      - name: Unit and architecture tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rofeh-rechev-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/
