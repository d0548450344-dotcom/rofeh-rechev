name: Web

on:
  push:
    branches: ["**"]
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: App tests (domain, ELM327 driver, fault codes)
        run: npm test
      - name: Production build
        run: npm run build
